<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: Stylized attendance mark -->
  <g transform="translate(10, 10)">
    <circle cx="30" cy="30" r="28" fill="url(#logoGrad)" opacity="0.1"/>
    <circle cx="30" cy="30" r="24" fill="none" stroke="url(#logoGrad)" stroke-width="3"/>
    <path d="M20 30 L26 36 L40 22" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="30" cy="18" r="3" fill="url(#logoGrad)"/>
  </g>

  <!-- Text -->
  <text x="80" y="30" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e3a8a">Nexa</text>
  <text x="80" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#10b981">Presence</text>

  <!-- Subtle background effect -->
  <rect x="75" y="15" width="200" height="50" rx="8" fill="url(#logoGrad)" opacity="0.05"/>
</svg>
